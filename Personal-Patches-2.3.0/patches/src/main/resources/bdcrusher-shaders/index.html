<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'none'; worker-src 'none'"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#poster{position:absolute;inset:-32%;width:164%;height:164%;object-fit:cover;animation:drift 24s ease-in-out infinite alternate;animation-play-state:paused}
@keyframes drift{from{transform:scale(1.02) rotate(-9deg)}to{transform:scale(1.15) rotate(9deg)}}
[hidden]{display:none!important}
</style></head><body><img id="poster" alt="" hidden><canvas aria-hidden="true" hidden></canvas><script src="shaders.js"></script></body></html>
